<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>嵌入环境复现</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2b2b2b; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!--
    用 localhost 打开本页、用 127.0.0.1 加载游戏，构造跨域 iframe。
    ?mode= 控制 iframe 的 allow 属性，用来分辨“省略”与“显式拒绝”的区别：
      absent —— 不写 allow（浏览器默认策略）
      mslike —— 复刻魔搭创空间那份 allow 列表（很长，但不含 pointer-lock）
      denied —— 显式 allow="pointer-lock 'none'"
  -->
  <iframe id="embed"></iframe>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'absent';
    const MS_ALLOW = 'accelerometer; ambient-light-sensor; autoplay; battery; camera; clipboard-read; '
      + 'clipboard-write; display-capture; document-domain; encrypted-media; fullscreen; geolocation; '
      + 'gyroscope; layout-animations; legacy-image-formats; magnetometer; microphone; midi; '
      + 'oversized-images; payment; picture-in-picture; publickey-credentials-get; sync-xhr; usb; vr; '
      + 'wake-lock; xr-spatial-tracking';
    const frame = document.getElementById('embed');
    if (mode === 'mslike') frame.setAttribute('allow', MS_ALLOW);
    if (mode === 'denied') frame.setAttribute('allow', "pointer-lock 'none'");
    frame.src = 'http://127.0.0.1:8790/';
  </script>
</body>
</html>
